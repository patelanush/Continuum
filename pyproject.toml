[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "durable-agent-runtime"
version = "0.1.0"
description = "A fault-tolerant execution runtime for long-running AI workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiokafka>=0.12,<1",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
continuum-faultlab = "durable_agent_runtime.faultlab.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/durable_agent_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -m 'not ollama' --cov=durable_agent_runtime --cov-report=term-missing --cov-fail-under=85"
markers = ["integration: requires PostgreSQL", "kafka: requires real Kafka", "faultlab: requires isolated Docker Compose stack", "ollama: optional real local Ollama model"]

[tool.coverage.run]
branch = true
source = ["durable_agent_runtime"]
# This module runs as a separate process inside disposable Docker sandboxes;
# host pytest coverage cannot observe it. Real-container integration tests cover its effects.
omit = ["src/durable_agent_runtime/coding/sandbox_tool.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*", "asyncpg", "asyncpg.*"]
ignore_missing_imports = true
