services:
  sandbox-image:
    image: continuum-sandbox:phase6
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    command: ["true"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: durable
      POSTGRES_PASSWORD: durable
      POSTGRES_DB: durable
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durable -d durable"]
      interval: 2s
      timeout: 3s
      retries: 20

  payments-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${PAYMENTS_POSTGRES_PORT:-55434}:5432"
    volumes:
      - payments_data:/var/lib/postgresql/data
      - ./docker/payments/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 2s
      timeout: 3s
      retries: 20

  mock-payments:
    build: .
    command: ["uvicorn", "durable_agent_runtime.mock_payments.app:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_SQLALCHEMY_INSTRUMENTATION: ${OTEL_SQLALCHEMY_INSTRUMENTATION:-false}
      PAYMENTS_DATABASE_URL: postgresql://payments:payments@payments-postgres:5432/payments
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${MOCK_PAYMENTS_PORT:-8001}:8001"
    depends_on:
      payments-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_SQLALCHEMY_INSTRUMENTATION: ${OTEL_SQLALCHEMY_INSTRUMENTATION:-false}
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://durable:durable@postgres:5432/durable
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${KAFKA_PORT:-19092}:19092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 20s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/continuum/init-topics.sh"]
    volumes:
      - ./docker/kafka/init-topics.sh:/opt/continuum/init-topics.sh:ro

  dispatcher:
    build: .
    command: ["python", "-m", "durable_agent_runtime.dispatcher.main"]
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_SQLALCHEMY_INSTRUMENTATION: ${OTEL_SQLALCHEMY_INSTRUMENTATION:-false}
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://durable:durable@postgres:5432/durable
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-0.5}
      OUTBOX_PUBLISH_LEASE_SECONDS: ${OUTBOX_PUBLISH_LEASE_SECONDS:-30}
      FAULTLAB_DISPATCHER_PAUSE_AFTER_ACK: ${FAULTLAB_DISPATCHER_PAUSE_AFTER_ACK:-0}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "durable_agent_runtime.worker.main"]
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_SQLALCHEMY_INSTRUMENTATION: ${OTEL_SQLALCHEMY_INSTRUMENTATION:-false}
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://durable:durable@postgres:5432/durable
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  executor:
    build: .
    command: ["python", "-m", "durable_agent_runtime.execution.executor"]
    restart: unless-stopped
    stop_grace_period: 65s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      APP_ENV: ${APP_ENV:-development}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_SQLALCHEMY_INSTRUMENTATION: ${OTEL_SQLALCHEMY_INSTRUMENTATION:-false}
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://durable:durable@postgres:5432/durable
      MOCK_PAYMENTS_URL: http://mock-payments:8001
      EXECUTOR_LEASE_SECONDS: ${EXECUTOR_LEASE_SECONDS:-20}
      EXECUTOR_HEARTBEAT_SECONDS: ${EXECUTOR_HEARTBEAT_SECONDS:-4}
      EXECUTOR_POLL_INTERVAL_SECONDS: ${EXECUTOR_POLL_INTERVAL_SECONDS:-0.5}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-90}
      MODEL_MAX_ATTEMPTS: ${MODEL_MAX_ATTEMPTS:-3}
      AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-8}
      CODING_AGENT_MAX_TURNS: ${CODING_AGENT_MAX_TURNS:-12}
      SANDBOX_IMAGE: continuum-sandbox:phase6
      SANDBOX_VOLUME_PREFIX: ${SANDBOX_VOLUME_PREFIX:-continuum}
      CODING_COMMAND_TIMEOUT_SECONDS: ${CODING_COMMAND_TIMEOUT_SECONDS:-30}
      FAULTLAB_PAUSE_AFTER_CLAIM: ${FAULTLAB_PAUSE_AFTER_CLAIM:-0}
      FAULTLAB_AGENT_PAUSE_AFTER_DECISION: ${FAULTLAB_AGENT_PAUSE_AFTER_DECISION:-0}
      FAULTLAB_AGENT_PAUSE_AFTER_TOOL_RESULT: ${FAULTLAB_AGENT_PAUSE_AFTER_TOOL_RESULT:-0}
      FAULTLAB_AGENT_PAUSE_AFTER_FINAL: ${FAULTLAB_AGENT_PAUSE_AFTER_FINAL:-0}
    depends_on:
      api:
        condition: service_healthy
      mock-payments:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully

  recovery-scheduler:
    build: .
    command: ["python", "-m", "durable_agent_runtime.execution.recovery"]
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_SQLALCHEMY_INSTRUMENTATION: ${OTEL_SQLALCHEMY_INSTRUMENTATION:-false}
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://durable:durable@postgres:5432/durable
      RECOVERY_SCAN_INTERVAL_SECONDS: ${RECOVERY_SCAN_INTERVAL_SECONDS:-1}
    depends_on:
      api:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    build:
      context: .
      dockerfile: observability/Dockerfile.probed
      args:
        BASE_IMAGE: otel/opentelemetry-collector-contrib:0.140.0
    profiles: [observability]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${OTLP_PORT:-4317}:4317"
    depends_on:
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-qO-", "http://127.0.0.1:13133/"]
      interval: 5s
      timeout: 3s
      retries: 12

  tempo:
    image: grafana/tempo:2.10.8
    build:
      context: .
      dockerfile: observability/Dockerfile.probed
      args:
        BASE_IMAGE: grafana/tempo:2.10.8
    profiles: [observability]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${TEMPO_PORT:-3200}:3200"
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-qO-", "http://127.0.0.1:3200/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.13.3
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12

  grafana:
    image: grafana/grafana:13.1.6
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: continuum-local
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  kafka_data:
  payments_data:
  tempo_data:
  prometheus_data:
  grafana_data:
