name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DATABASE_URL: postgresql+asyncpg://durable:durable@localhost:55435/durable_test
      TEST_DATABASE_URL: postgresql+asyncpg://durable:durable@localhost:55435/durable_test
      KAFKA_BOOTSTRAP_SERVERS: localhost:19093
      MOCK_PAYMENTS_URL: http://localhost:18001
      PAYMENTS_DATABASE_URL: postgresql://payments:payments@localhost:55436/payments
      RUN_FAULTLAB_DOCKER: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run continuum-faultlab up
      - run: uv run alembic upgrade head
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
      - run: uv run continuum-faultlab clean
        if: always()
